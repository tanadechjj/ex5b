<html>

  <body>
    <div class="container-fluid">
		<h1>Temperature conversion</h1>
		<img src="images/temperature.gif" class="img-fluid" alt="runner logo" width="150" height="150"><br>
		<hr> <form role="form" method="GET">
		  <div class="form-group">
			<label for="tem">Current temperature (Celsius):</label>
			<input type="text" class="form-control" name="temp" id="temp" value="20">
		  </div><br>
		  <div class="form-group">
			<label for="tem">Unit:</label>
			<select class="form-select" aria-label="Default select example" id="unit">
			  <option value="F">Fahrenheit</option>
			  <option value="K">Kelvin</option>
			  <option value="R">Réaumur</option>
			</select>
		  </div>
		  <br><button type="button" class="btn btn-primary">Convert</button>
		</form>
	</div>
	<div id="result" style="margin-top:10px;margin-left:10px; font-size: 20px; color:red;">
	</div>
	
	<script>
		function validateTemperature(t) {
    		if (isNaN(t)) {
        		alert("Please verify whether the temperature value is correct!!!");
        		return false;
    		}
    		if (!(t >= -100 && t <= 100)) {
        		alert("Temperature entered (in Celsius) must be between -100 and 100!!!");
        		return false;
    		}
   			return true;
		}

		function convertTemperature(t, u) {
    		var msg = "";
    		if (u == "F") {
        		var f = (t * 9 / 5) + 32;
        		msg = "Temperature is " + f + " in Fahrenheit";
    		} else if (u == "K") {
        		var k = t + 273.15;
        		msg = "Temperature is " + k + " in Kelvin";
    		} else if (u == "R") {
        		var r = t * 4 / 5;
        		msg = "Temperature is " + r + " in Réaumur";
    		}
    		return msg; 
		}
		
	    $(document).ready(function(){
			$("button").click(function(){
			   var t = Number($('#temp').val());//celsius
			   var u = $('#unit').val();
			   
			   if (!validateTemperature(t)) {
            	return;
			   }

	</script>
</body>
</html>
